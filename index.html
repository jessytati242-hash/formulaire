<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="head">
        <h2>INFORMATIONS PERSONNELLES</h2>
        <p>
            Veuillez remplir les informations ci-dessous pour creer votre compte
        </p>
    </div>
    <div class="body">
        <form>
            <p>
                ENTREZ VOS INFORMATIONS CI-DESSOUS <br><br>
                <label for="name">Votre nom</label><br>
                <input type="text" id="name" name="name"><br><br>
                <label for="first_name">Votre prenom</label><br>
                <input type="text" id="first_name" name="first_name"><br><br>
                <label for="number">Votre numero de telephone</label><br>
                <input type="tel" id="number" name="number"><br><br>
                <label for="birthday">Date de naissance</label><br>
                <input type="date" id="birthday" name="birthday"><br><br>
                SEXE <br>
                
                <input type="radio" id="masculin" name="sexe"> <label for="masculin">Masculin</label><br>
                <input type="radio" id="feminin" name="sexe"> <label for="feminin">Feminin</label><br><br>
                VOTRE STATUTS <br>
                <input type="radio" id="student" name="status"> <label for="student">Etudiant(e)</label><br>
                <input type="radio" id="teacher" name="status"> <label for="teacher">Enseignant(e)</label><br>
                <input type="radio" id="civil_serval" name="status"> <label for="civil_serval">Fonctionnaire</label><br><br>
                VOTRE PAYS ACTUEL?<br>
                <select name="pays" id="pays">
                    <option value="congo-brazzaville">CONGO-BRAZZAVILLE</option>
                    <option value="congo-kinshasa">CONGO-KINSHASA</option>
                    <option value="senegale">SENEGALE</option>
                    <option value="gabon">GABON</option>
                    <option value="maroc">MAROC</option>
                    <option value="espagne">ESPAGNE</option>
                    <option value="chine">CHINE</option>
                    <option value="canada">CANADA</option>
                    <option value="france">FRANCE</option>
                </select><br><br>
                VOTRE METIER <br>
                <input type="checkbox" id="dev_web"> <label for="dev_web">Developpeur Web</label><br>
                <input type="checkbox" id="dev_mobile"> <label for="dev_mobile">Developpeur Mobile</label><br>
                <input type="checkbox" id="fullstack"> <label for="fullstack">Full-Stack</label><br>
                <input type="checkbox" id="dev_back-end"> <label for="dev_back-end">Developpeur Back-end</label><br>
                <input type="checkbox" id="dev_font-end"> <label for="dev_font-end">Developpeur Font-end</label><br>
                <input type="checkbox" id="devops"> <label for="devops">Devops</label><br><br>
                
                DONNEZ VOTRE DESCRIPTION <br>
                <textarea name="description" id="description"> </textarea><br><br>
            </p>
            <button>S'inscrire</button>
        </form>
    </div>
    
</body>
</html>
